[project]
name = "traffic-intelligence-system"
version = "0.1.0"
description = "Traffic analytics system: vehicle/pedestrian detection, tracking and event analytics."
readme = "README.md"
authors = [
    { name = "Mahdi Mashayekhi", email = "mahdimashayekhi.ai@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fiftyone>=1.22.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "torch",
    "torchvision",
    "ultralytics>=8.4.164",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "data-tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
data-tools = [
    "numpy",
    "pyyaml",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pillow",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
